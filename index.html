<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LegionBlackJournal</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  a.stage { display: block; width: 100%; height: 100%; -webkit-tap-highlight-color: transparent; }
  /* Mai deformata: l'immagine mantiene sempre le sue proporzioni */
  a.stage img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; }

  #countdown {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: clamp(56px, 9vmin, 92px);
    height: clamp(56px, 9vmin, 92px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: #000;
    border: 2px solid #3a0000;
    display: flex; align-items: center; justify-content: center;
    color: #ff1a1a;
    font: 700 clamp(26px, 4.6vmin, 46px)/1 Arial, Helvetica, sans-serif;
    text-shadow: 0 0 6px #ff0000, 0 0 16px #ff0000;
    box-shadow: 0 0 14px rgba(255, 0, 0, .35);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>

<!-- PC (schermo orizzontale): composizione 16:9. Smartphone: immagine verticale originale. -->
<a class="stage" id="stage" href="https://www.youtube.com/@LegionBlackJournal">
  <picture>
    <source media="(orientation: landscape) and (min-width: 700px)" srcset="legion-desktop.jpg">
    <img src="legion-mobile.jpg" alt="LegionBlackJournal">
  </picture>
</a>

<div id="countdown" aria-live="off">10</div>

<audio id="music" src="audio.mp3" preload="auto"></audio>

<script>
(function () {
  var URL = "https://www.youtube.com/@LegionBlackJournal";
  var audio = document.getElementById("music");
  var stage = document.getElementById("stage");
  var box = document.getElementById("countdown");
  var audioPlaying = false;
  var leaving = false;

  audio.volume = 1;

  function startAudio() {
    var p = audio.play();
    if (p && p.then) {
      p.then(function () { audioPlaying = true; })
       .catch(function () { audioPlaying = false; });
    }
  }
  function stopAudio() { try { audio.pause(); } catch (e) {} }

  // 1) Tentativo di riproduzione automatica (i browser possono bloccarla)
  startAudio();

  // 2) Se bloccata, il primo tocco/tasto attiva la musica
  var unlockTried = false;
  function unlock() {
    if (audioPlaying || unlockTried) return;
    unlockTried = true;
    startAudio();
  }
  window.addEventListener("pointerdown", unlock, { once: true });
  window.addEventListener("keydown", unlock, { once: true });

  // 3) Un tocco/clic sull'immagine apre il canale.
  //    Se la musica era bloccata, il primo tocco la attiva e NON cambia pagina;
  //    il tocco successivo apre il canale.
  var firstTapConsumed = false;
  stage.addEventListener("click", function (e) {
    e.preventDefault();
    if (!audioPlaying && !firstTapConsumed) {
      firstTapConsumed = true;
      startAudio();
      return;
    }
    go();
  });

  function go() {
    if (leaving) return;
    leaving = true;
    stopAudio();
    window.location.href = URL; // stessa scheda, nessuna scheda aggiuntiva
  }

  // Conto alla rovescia 10 -> 0, poi redirect
  var n = 10;
  box.textContent = n;
  var timer = setInterval(function () {
    n--;
    box.textContent = n;
    if (n <= 0) {
      clearInterval(timer);
      setTimeout(go, 700);
    }
  }, 1000);

  window.addEventListener("pagehide", stopAudio);
})();
</script>
</body>
</html>
