<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>LegionBlackJournal</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}


/* =====================================================
   PAGINA YOUTUBE - SEMPRE DIETRO
   ===================================================== */

#channel{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}


/* =====================================================
   LEGION
   ===================================================== */

#legion{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:2;

    /*
    Legion rimane visibile.
    Sparisce SOLO quando il fumo lo ha coperto.
    */

    animation:
        legionDisappear .20s linear 2.95s forwards;
}


@keyframes legionDisappear{

    0%{
        opacity:1;
        visibility:visible;
    }

    100%{
        opacity:0;
        visibility:hidden;
    }
}


/* =====================================================
   CONTENITORE FUMO
   ===================================================== */

#smoke{
    position:fixed;
    inset:-20%;
    width:140%;
    height:140%;
    z-index:5;
    pointer-events:none;
    overflow:hidden;
}


/* =====================================================
   ASPETTO GENERALE FUMO
   NERO + ROSSO
   ===================================================== */

.smoke{
    position:absolute;

    border-radius:
        45% 55% 62% 38% /
        55% 42% 58% 45%;

    opacity:0;

    filter:
        blur(22px)
        contrast(1.35)
        saturate(1.45);

    background:

        radial-gradient(
            ellipse at 35% 45%,
            rgba(255,0,0,.90) 0%,
            rgba(170,0,0,.72) 13%,
            rgba(35,0,0,.88) 30%,
            rgba(0,0,0,.98) 52%,
            rgba(0,0,0,.70) 68%,
            transparent 82%
        ),

        radial-gradient(
            ellipse at 70% 55%,
            rgba(0,0,0,1) 0%,
            rgba(18,18,18,.98) 38%,
            rgba(130,0,0,.65) 60%,
            transparent 80%
        );
}


/* =====================================================
   NUBE SINISTRA
   ===================================================== */

.s1{

    width:90vmax;
    height:65vmax;

    left:-65vmax;
    top:5vh;

    animation:
        smokeLeft 3.2s
        cubic-bezier(.35,.05,.25,1)
        1.25s forwards;
}


/* =====================================================
   NUBE DESTRA
   ===================================================== */

.s2{

    width:95vmax;
    height:72vmax;

    right:-70vmax;
    top:-5vh;

    animation:
        smokeRight 3.25s
        cubic-bezier(.35,.05,.25,1)
        1.35s forwards;
}


/* =====================================================
   NUBE DAL BASSO
   ===================================================== */

.s3{

    width:110vmax;
    height:75vmax;

    left:5vw;
    bottom:-65vmax;

    animation:
        smokeBottom 3.35s
        cubic-bezier(.35,.05,.25,1)
        1.40s forwards;
}


/* =====================================================
   VORTICE CENTRALE NERO
   ===================================================== */

.s4{

    width:95vmax;
    height:80vmax;

    left:20vw;
    top:10vh;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,0,0,1) 0%,
            rgba(8,8,8,.98) 28%,
            rgba(90,0,0,.78) 48%,
            rgba(230,0,0,.50) 62%,
            transparent 80%
        );

    animation:
        smokeVortex 2.9s
        cubic-bezier(.3,.05,.3,1)
        1.55s forwards;
}


/* =====================================================
   FILAMENTO ROSSO 1
   ===================================================== */

.s5{

    width:75vmax;
    height:28vmax;

    left:-45vmax;
    top:35vh;

    filter:
        blur(13px)
        saturate(1.8);

    background:

        radial-gradient(
            ellipse,
            rgba(255,25,10,.95) 0%,
            rgba(210,0,0,.78) 20%,
            rgba(60,0,0,.60) 48%,
            transparent 72%
        );

    animation:
        redTwist1 3.1s
        ease-in-out
        1.35s forwards;
}


/* =====================================================
   FILAMENTO ROSSO 2
   ===================================================== */

.s6{

    width:80vmax;
    height:30vmax;

    right:-50vmax;
    top:18vh;

    filter:
        blur(15px)
        saturate(1.8);

    background:

        radial-gradient(
            ellipse,
            rgba(255,20,10,.92) 0%,
            rgba(180,0,0,.75) 22%,
            rgba(40,0,0,.65) 50%,
            transparent 74%
        );

    animation:
        redTwist2 3.2s
        ease-in-out
        1.45s forwards;
}


/* =====================================================
   ANIMAZIONI
   ===================================================== */


@keyframes smokeLeft{

    0%{
        opacity:0;
        transform:
            translateX(0)
            rotate(-15deg)
            scale(.55);
    }

    18%{
        opacity:.85;
    }

    45%{
        opacity:1;
        transform:
            translateX(62vmax)
            translateY(-5vh)
            rotate(12deg)
            scale(1.10);
    }

    58%{
        opacity:1;
        transform:
            translateX(72vmax)
            translateY(-2vh)
            rotate(22deg)
            scale(1.30);
    }

    75%{
        opacity:.72;
    }

    100%{
        opacity:0;
        transform:
            translateX(130vmax)
            translateY(-30vh)
            rotate(55deg)
            scale(1.65);
    }
}



@keyframes smokeRight{

    0%{
        opacity:0;
        transform:
            translateX(0)
            rotate(18deg)
            scale(.55);
    }

    18%{
        opacity:.85;
    }

    45%{
        opacity:1;
        transform:
            translateX(-65vmax)
            translateY(8vh)
            rotate(-12deg)
            scale(1.12);
    }

    58%{
        opacity:1;
        transform:
            translateX(-76vmax)
            rotate(-25deg)
            scale(1.32);
    }

    75%{
        opacity:.70;
    }

    100%{
        opacity:0;
        transform:
            translateX(-135vmax)
            translateY(-35vh)
            rotate(-60deg)
            scale(1.70);
    }
}



@keyframes smokeBottom{

    0%{
        opacity:0;
        transform:
            translateY(0)
            rotate(0deg)
            scale(.50);
    }

    20%{
        opacity:.80;
    }

    45%{
        opacity:1;
        transform:
            translateY(-62vmax)
            rotate(10deg)
            scale(1.12);
    }

    58%{
        opacity:1;
        transform:
            translateY(-72vmax)
            rotate(-10deg)
            scale(1.30);
    }

    78%{
        opacity:.60;
    }

    100%{
        opacity:0;
        transform:
            translateY(-130vmax)
            rotate(35deg)
            scale(1.70);
    }
}



@keyframes smokeVortex{

    0%{
        opacity:0;
        transform:
            scale(.20)
            rotate(-25deg);
    }

    25%{
        opacity:.85;
    }

    48%{
        opacity:1;
        transform:
            scale(1.10)
            rotate(18deg);
    }

    60%{
        opacity:1;
        transform:
            scale(1.35)
            rotate(32deg);
    }

    78%{
        opacity:.55;
    }

    100%{
        opacity:0;
        transform:
            scale(2.10)
            rotate(80deg)
            translateY(-10vh);
    }
}



@keyframes redTwist1{

    0%{
        opacity:0;
        transform:
            translateX(0)
            rotate(-20deg)
            scale(.4);
    }

    25%{
        opacity:.85;
    }

    50%{
        opacity:1;
        transform:
            translateX(70vmax)
            translateY(-12vh)
            rotate(35deg)
            scale(1.15);
    }

    68%{
        opacity:.75;
    }

    100%{
        opacity:0;
        transform:
            translateX(145vmax)
            translateY(-40vh)
            rotate(100deg)
            scale(1.65);
    }
}



@keyframes redTwist2{

    0%{
        opacity:0;
        transform:
            translateX(0)
            rotate(25deg)
            scale(.4);
    }

    25%{
        opacity:.85;
    }

    50%{
        opacity:1;
        transform:
            translateX(-75vmax)
            translateY(15vh)
            rotate(-35deg)
            scale(1.18);
    }

    68%{
        opacity:.70;
    }

    100%{
        opacity:0;
        transform:
            translateX(-145vmax)
            translateY(-35vh)
            rotate(-105deg)
            scale(1.70);
    }
}


/* =====================================================
   SMARTPHONE
   ===================================================== */

@media (max-width:700px){

    #channel{
        object-position:center center;
    }

    #legion{
        object-position:center center;
    }

    .s1,
    .s2,
    .s3,
    .s4{
        transform-origin:center;
    }
}

</style>
</head>


<body>


<!--
PAGINA YOUTUBE.
È già presente sotto Legion fin dall'inizio.
-->

<img
    id="channel"
    src="youtube-channel.png"
    alt="">


<!-- LEGION -->

<img
    id="legion"
    src="OK.png"
    alt="">


<!-- FUMO -->

<div id="smoke">

    <div class="smoke s1"></div>

    <div class="smoke s2"></div>

    <div class="smoke s3"></div>

    <div class="smoke s4"></div>

    <div class="smoke s5"></div>

    <div class="smoke s6"></div>

</div>


<script>

const YOUTUBE =
"https://www.youtube.com/@LegionBlackJournal";


/*
SEQUENZA

0.00  Legion visibile

1.25  comincia il fumo nero/rosso

2.95  il fumo ha coperto Legion:
      Legion viene eliminato definitivamente

3.00+ sotto il fumo c'è GIÀ
      youtube-channel.png

4.5 circa:
      il fumo si apre e mostra YouTube

5.0:
      passaggio alla pagina YouTube vera
*/


setTimeout(()=>{

    window.location.replace(YOUTUBE);

},5000);


</script>

</body>
</html>
