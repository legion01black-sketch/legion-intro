<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>LegionBlackJournal</title>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

/* ==================================================
   LEGION
   ================================================== */

#legion{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  z-index:1;
}


/* ==================================================
   STRATO FUMO
   ================================================== */

#smoke{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:3;
  pointer-events:none;
  overflow:hidden;
  background:#000;
  opacity:0;
  animation:smokeLayer 2.7s ease-in-out 1.55s forwards;
}


/* ==================================================
   NUVOLE DI FUMO NERO
   ================================================== */

.puff{
  position:absolute;

  border-radius:45% 55% 50% 50%;

  opacity:0;

  filter:
    blur(28px)
    contrast(1.3);

  background:
    radial-gradient(
      ellipse at 45% 50%,
      rgba(0,0,0,1) 0%,
      rgba(5,5,5,.98) 25%,
      rgba(12,12,12,.92) 45%,
      rgba(20,20,20,.65) 62%,
      rgba(0,0,0,0) 78%
    );
}


/* FUMO DA SINISTRA */

.p1{
  width:95vmax;
  height:70vmax;

  left:-70vmax;
  top:-10vmax;

  animation:
    smokeLeft 2.4s
    ease-in-out
    1.55s forwards;
}


/* FUMO DA DESTRA */

.p2{
  width:100vmax;
  height:75vmax;

  right:-75vmax;
  top:5vh;

  animation:
    smokeRight 2.5s
    ease-in-out
    1.65s forwards;
}


/* FUMO DAL BASSO */

.p3{
  width:110vmax;
  height:80vmax;

  left:-5vmax;
  bottom:-70vmax;

  animation:
    smokeBottom 2.6s
    ease-in-out
    1.70s forwards;
}


/* NUBE CENTRALE */

.p4{
  width:105vmax;
  height:90vmax;

  left:-2vmax;
  top:5vh;

  animation:
    smokeCenter 2.3s
    ease-in-out
    1.80s forwards;
}


/* ==================================================
   OSCURAMENTO GENERALE
   ================================================== */

@keyframes smokeLayer{

  0%{
    opacity:0;
    background:rgba(0,0,0,0);
  }

  30%{
    opacity:1;
    background:rgba(0,0,0,.10);
  }

  60%{
    opacity:1;
    background:rgba(0,0,0,.60);
  }

  82%{
    opacity:1;
    background:rgba(0,0,0,.96);
  }

  100%{
    opacity:1;
    background:#000;
  }
}


/* ==================================================
   MOVIMENTI DEL FUMO
   ================================================== */

@keyframes smokeLeft{

  0%{
    opacity:0;
    transform:
      translateX(0)
      scale(.65);
  }

  25%{
    opacity:.95;
  }

  55%{
    opacity:1;
    transform:
      translateX(65vmax)
      scale(1.15);
  }

  75%{
    opacity:.95;
  }

  100%{
    opacity:.85;
    transform:
      translateX(100vmax)
      translateY(-12vh)
      scale(1.45);
  }
}


@keyframes smokeRight{

  0%{
    opacity:0;
    transform:
      translateX(0)
      scale(.60);
  }

  25%{
    opacity:.90;
  }

  55%{
    opacity:1;
    transform:
      translateX(-70vmax)
      scale(1.20);
  }

  75%{
    opacity:.95;
  }

  100%{
    opacity:.85;
    transform:
      translateX(-105vmax)
      translateY(-15vh)
      scale(1.45);
  }
}


@keyframes smokeBottom{

  0%{
    opacity:0;
    transform:
      translateY(0)
      scale(.60);
  }

  25%{
    opacity:.85;
  }

  55%{
    opacity:1;
    transform:
      translateY(-65vmax)
      scale(1.15);
  }

  75%{
    opacity:.95;
  }

  100%{
    opacity:.85;
    transform:
      translateY(-100vmax)
      scale(1.50);
  }
}


@keyframes smokeCenter{

  0%{
    opacity:0;
    transform:scale(.35);
  }

  30%{
    opacity:.95;
  }

  55%{
    opacity:1;
    transform:scale(1.15);
  }

  75%{
    opacity:1;
  }

  100%{
    opacity:.95;
    transform:
      scale(1.75)
      translateY(-8vh);
  }
}


/* ==================================================
   SMARTPHONE
   ================================================== */

@media(max-width:700px){

  #legion{
    object-position:center center;
  }

}

</style>
</head>


<body>


<!-- LEGION -->

<img
  id="legion"
  src="OK.png"
  alt="LegionBlackJournal">


<!-- FUMO -->

<div id="smoke">

  <div class="puff p1"></div>

  <div class="puff p2"></div>

  <div class="puff p3"></div>

  <div class="puff p4"></div>

</div>


<script>

/* ==================================================
   DESTINAZIONE
   ================================================== */

const CHANNEL =
"https://www.youtube.com/@LegionBlackJournal";


/* ==================================================
   APERTURA YOUTUBE
   ================================================== */

function openYouTube(){

  const mobile =
    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    );


  /* ------------------------------
     PC
     ------------------------------ */

  if(!mobile){

    window.location.replace(CHANNEL);

    return;
  }


  /* ------------------------------
     ANDROID
     ------------------------------ */

  if(/Android/i.test(navigator.userAgent)){

    const intent =
      "intent://www.youtube.com/@LegionBlackJournal" +
      "#Intent;" +
      "scheme=https;" +
      "package=com.google.android.youtube;" +
      "S.browser_fallback_url=" +
      encodeURIComponent(CHANNEL) +
      ";end";

    window.location.href = intent;

    return;
  }


  /* ------------------------------
     IPHONE / IPAD

     Proviamo ad aprire l'app YouTube.
     Se non parte, fallback al browser.
     ------------------------------ */

  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){

    window.location.href =
      "youtube://www.youtube.com/@LegionBlackJournal";

    setTimeout(()=>{

      if(!document.hidden){
        window.location.replace(CHANNEL);
      }

    },1200);

    return;
  }


  window.location.replace(CHANNEL);
}


/* ==================================================
   SEQUENZA

   0.00 s  Legion
   1.55 s  parte il fumo
   3.8  s  immagine quasi completamente coperta
   4.15 s  apertura YouTube

   NON compare più la foto della pagina YouTube.
   ================================================== */

setTimeout(()=>{

  openYouTube();

},4150);

</script>


</body>
</html>
