<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LegionBlackJournal</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#channel,#legion,#smoke{position:fixed;inset:0;width:100%;height:100%}
#channel{object-fit:cover;opacity:0;animation:channelIn .9s ease 2.15s forwards}
#legion{object-fit:cover;z-index:3;animation:legionOut 1.9s ease 2s forwards}
#smoke{z-index:4;pointer-events:none;opacity:0;filter:blur(10px) contrast(1.3)}
.puff{position:absolute;border-radius:50%;background:
radial-gradient(circle at 42% 45%,rgba(50,50,50,.96) 0 18%,rgba(20,20,20,.92) 34%,rgba(0,0,0,.76) 58%,transparent 72%);
mix-blend-mode:normal}
.p1{width:70vmax;height:70vmax;left:-18vmax;top:8vh;animation:puff1 2.3s ease-out 1.8s both}
.p2{width:78vmax;height:78vmax;right:-25vmax;top:-8vh;animation:puff2 2.5s ease-out 1.9s both}
.p3{width:85vmax;height:85vmax;left:8vw;bottom:-45vmax;animation:puff3 2.6s ease-out 2s both}
@keyframes legionOut{
  0%{opacity:1;filter:none;transform:scale(1)}
  35%{opacity:.92;filter:contrast(1.15) brightness(.85)}
  70%{opacity:.45;filter:blur(5px) brightness(.5);transform:scale(1.025)}
  100%{opacity:0;filter:blur(18px) brightness(.1);transform:scale(1.05)}
}
@keyframes channelIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:scale(1)}}
@keyframes puff1{0%{opacity:0;transform:translate(-12vw,8vh) scale(.35)}35%{opacity:.95}100%{opacity:0;transform:translate(42vw,-22vh) scale(1.15)}}
@keyframes puff2{0%{opacity:0;transform:translate(12vw,12vh) scale(.3)}38%{opacity:.9}100%{opacity:0;transform:translate(-38vw,-28vh) scale(1.2)}}
@keyframes puff3{0%{opacity:0;transform:translateY(18vh) scale(.3)}40%{opacity:.9}100%{opacity:0;transform:translateY(-55vh) scale(1.25)}}
</style>
</head>
<body>
<img id="channel" src="youtube-channel.png" alt="">
<img id="legion" src="legion.jpg" alt="">
<div id="smoke">
  <div class="puff p1"></div><div class="puff p2"></div><div class="puff p3"></div>
</div>
<script>
const YOUTUBE="https://www.youtube.com/@LegionBlackJournal";
setTimeout(()=>{ window.location.replace(YOUTUBE); }, 4700);
</script>
</body>
</html>
