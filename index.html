<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LegionBlackJournal</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#channel,#legion,#smoke{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#channel{
  object-fit:cover;
  z-index:1;
}

#legion{
  object-fit:cover;
  z-index:2;
  animation:hideLegion .01s linear 3.05s forwards;
}

/* STRATO DI FUMO */
#smoke{
  z-index:3;
  pointer-events:none;
  overflow:hidden;
}

.puff{
  position:absolute;
  border-radius:45% 55% 50% 50%;
  opacity:0;
  filter:blur(28px);
  background:
    radial-gradient(
      ellipse at 45% 50%,
      rgba(0,0,0,1) 0%,
      rgba(5,5,5,.98) 25%,
      rgba(12,12,12,.92) 45%,
      rgba(20,20,20,.65) 62%,
      rgba(0,0,0,0) 78%
    );
}

/* FUMO DA SINISTRA */
.p1{
  width:95vmax;
  height:70vmax;
  left:-70vmax;
  top:-10vmax;
  animation:smokeLeft 2.4s ease-in-out 1.75s forwards;
}

/* FUMO DA DESTRA */
.p2{
  width:100vmax;
  height:75vmax;
  right:-75vmax;
  top:5vh;
  animation:smokeRight 2.5s ease-in-out 1.85s forwards;
}

/* FUMO DAL BASSO */
.p3{
  width:110vmax;
  height:80vmax;
  left:-5vmax;
  bottom:-70vmax;
  animation:smokeBottom 2.6s ease-in-out 1.9s forwards;
}

/* NUBE CENTRALE */
.p4{
  width:105vmax;
  height:90vmax;
  left:-2vmax;
  top:5vh;
  animation:smokeCenter 2.2s ease-in-out 2.05s forwards;
}

@keyframes smokeLeft{
  0%{opacity:0;transform:translateX(0) scale(.65)}
  25%{opacity:.95}
  55%{opacity:1;transform:translateX(65vmax) scale(1.15)}
  75%{opacity:.8}
  100%{opacity:0;transform:translateX(115vmax) translateY(-15vh) scale(1.5)}
}

@keyframes smokeRight{
  0%{opacity:0;transform:translateX(0) scale(.6)}
  25%{opacity:.9}
  55%{opacity:1;transform:translateX(-70vmax) scale(1.2)}
  75%{opacity:.75}
  100%{opacity:0;transform:translateX(-120vmax) translateY(-20vh) scale(1.5)}
}

@keyframes smokeBottom{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  25%{opacity:.85}
  55%{opacity:1;transform:translateY(-65vmax) scale(1.15)}
  75%{opacity:.7}
  100%{opacity:0;transform:translateY(-115vmax) scale(1.55)}
}

@keyframes smokeCenter{
  0%{opacity:0;transform:scale(.35)}
  30%{opacity:.95}
  52%{opacity:1;transform:scale(1.15)}
  70%{opacity:.8}
  100%{opacity:0;transform:scale(1.8) translateY(-12vh)}
}

@keyframes hideLegion{
  to{visibility:hidden}
}
</style>
</head>

<body>

<img id="channel" src="youtube-channel.png" alt="">
<img id="legion" src="OK.png" alt="">

<div id="smoke">
  <div class="puff p1"></div>
  <div class="puff p2"></div>
  <div class="puff p3"></div>
  <div class="puff p4"></div>
</div>

<script>
const YOUTUBE="https://www.youtube.com/@LegionBlackJournal";

setTimeout(()=>{
  window.location.replace(YOUTUBE);
},5200);
</script>

</body>
</html>
