<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LegionBlackJournal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{display:flex;align-items:center;justify-content:center}video{width:100vw;height:100dvh;object-fit:contain;background:#000;display:block;cursor:pointer}video::-webkit-media-controls{display:none}
</style>
</head>
<body>
<video id="intro" autoplay playsinline preload="auto" disablepictureinpicture aria-label="LegionBlackJournal: tocca per aprire YouTube">
<source src="LegionBlackJournal_INTRO_10s_NUOVA_FOTO.mp4" type="video/mp4">
</video>
<script>
(()=>{
  const youtube='https://www.youtube.com/@LegionBlackJournal';
  const video=document.getElementById('intro');
  let redirected=false;
  function go(){
    if(redirected)return;
    redirected=true;
    clearTimeout(timer);
    video.pause();video.muted=true;
    window.location.assign(youtube);
  }
  const timer=setTimeout(go,10000);
  document.addEventListener('pointerdown',go,{once:true});
  document.addEventListener('keydown',go,{once:true});
  video.addEventListener('ended',go,{once:true});
  video.volume=1;
  const attempt=video.play();
  if(attempt&&typeof attempt.catch==='function')attempt.catch(()=>{
    // Il browser può impedire l'autoplay con audio: tenta almeno di mostrare il video.
    video.muted=true;
    video.play().catch(()=>{});
  });
})();
</script>
</body>
</html>
