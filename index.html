<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LegionBlackJournal</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* Riempie le eventuali bande ai lati con la stessa grafica sfocata, senza tagli né deformazioni */
  #fill { position: fixed; inset: -40px; background: #000 center / cover no-repeat; filter: blur(40px) brightness(.7); }
  @media (orientation: landscape) and (min-width: 700px) { #fill { background-image: url(legion-desktop.jpg); } }
  @media not all and (orientation: landscape) and (min-width: 700px) { #fill { background-image: url(legion-mobile.jpg); } }
  #stage { position: fixed; inset: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
  /* Riquadro con le stesse proporzioni della grafica: così il pulsante è sempre nel punto giusto */
  #frame {
    --r: 0.5628;                      /* smartphone: 941x1672 */
    --clip: inset(9.87% 8.6% 84.75% 9.03%);
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * var(--r)));
    height: min(100vh, calc(100vw / var(--r)));
  }
  @supports (height: 100dvh) {
    #frame { width: min(100vw, calc(100dvh * var(--r))); height: min(100dvh, calc(100vw / var(--r))); }
  }
  @media (orientation: landscape) and (min-width: 700px) {
    #frame { --r: 1.7778; --clip: inset(19.5% 23.6% 70.6% 23.9%); }   /* PC: 16:9 */
  }
  #frame picture { position: absolute; inset: 0; }
  #frame img { display: block; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; }

  /* Solo il pulsante "CLICCA PER VEDERE IL VIDEO" cambia colore a scatti finché non si tocca */
  #blue { clip-path: var(--clip); animation: multi 1.5s linear infinite; }
  #blue.steady { animation: none; filter: none; }
  @keyframes multi {
    0%, 19.99%   { filter: hue-rotate(0deg)   saturate(1.3); }   /* azzurro */
    20%, 39.99%  { filter: hue-rotate(105deg) saturate(1.3); }   /* viola/magenta */
    40%, 59.99%  { filter: hue-rotate(225deg) saturate(1.3); }   /* giallo */
    60%, 79.99%  { filter: hue-rotate(285deg) saturate(1.3); }   /* verde */
    80%, 100%    { filter: hue-rotate(165deg) saturate(1.3); }   /* rosso/arancio */
  }

  #countdown {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: clamp(56px, 9vmin, 92px);
    height: clamp(56px, 9vmin, 92px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: #000;
    border: 2px solid #3a0000;
    display: flex; align-items: center; justify-content: center;
    color: #ff1a1a;
    font: 700 clamp(26px, 4.6vmin, 46px)/1 Arial, Helvetica, sans-serif;
    text-shadow: 0 0 6px #ff0000, 0 0 16px #ff0000;
    box-shadow: 0 0 14px rgba(255, 0, 0, .35);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="fill"></div>
<div id="stage" role="img" aria-label="LegionBlackJournal">
  <div id="frame">
    <picture>
      <source media="(orientation: landscape) and (min-width: 700px)" srcset="legion-desktop.jpg">
      <img src="legion-mobile.jpg" alt="">
    </picture>
    <!-- Stessa grafica col pulsante azzurro: visibile solo nell'area del pulsante, cambia colore -->
    <picture id="blue">
      <source media="(orientation: landscape) and (min-width: 700px)" srcset="legion-desktop-blue.jpg">
      <img src="legion-mobile-blue.jpg" alt="">
    </picture>
  </div>
</div>

<div id="countdown">10</div>
<audio id="music" src="audio.mp3" preload="auto"></audio>

<script>
(function () {
  var URL = "https://www.youtube.com/@LegionBlackJournal";
  var audio = document.getElementById("music");
  var blue = document.getElementById("blue");
  var box = document.getElementById("countdown");
  var started = false, leaving = false;

  audio.volume = 1;
  box.textContent = 10;

  function stopAudio() { try { audio.pause(); } catch (e) {} }

  function go() {
    if (leaving) return;
    leaving = true;
    stopAudio();
    window.location.href = URL; // stessa scheda
  }

  // UN SOLO tocco/clic: ferma il lampeggio, avvia la musica e fa partire i 10 secondi
  function start() {
    if (started) return;
    started = true;
    blue.classList.add("steady");
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
    var n = 10;
    var timer = setInterval(function () {
      n--;
      box.textContent = n;
      if (n <= 0) {
        clearInterval(timer);
        setTimeout(go, 700);
      }
    }, 1000);
  }

  document.getElementById("stage").addEventListener("click", start);
  window.addEventListener("keydown", start);
  window.addEventListener("pagehide", stopAudio);
})();
</script>
</body>
</html>
